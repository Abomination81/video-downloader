<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Your full-page screenshot, assembled privately on your device.">
  <title>Still: Private capture</title>
  <link rel="icon" href="icons/32.png">
  <link rel="stylesheet" href="preview.css">
  <script type="module" src="preview.js"></script>
</head>
<body>
  <header class="toolbar">
    <div class="identity"><img src="icons/48.png" width="32" height="32" alt=""><strong>Still</strong><span>Private full-page capture</span></div>
    <div class="actions">
      <button id="zoom" type="button" disabled aria-pressed="false">Actual size</button>
      <button id="discard" type="button">Cancel capture</button>
      <a id="save" class="primary" aria-disabled="true">Save PNG</a>
    </div>
  </header>
  <main>
    <section class="summary" aria-labelledby="heading">
      <div><h1 id="heading">Capturing your page</h1><p id="status" role="status" aria-live="polite">Keep the source tab selected until capture finishes.</p></div>
      <p class="privacy">On your device.<br>Only saved when you choose.</p>
    </section>
    <progress id="progress" aria-label="Capture progress" max="100" value="0"></progress>
    <p id="notice" hidden></p>
    <div id="images" aria-label="Screenshot preview"></div>
    <noscript>JavaScript is needed to assemble your screenshot. Enable the extension and click Still on a webpage.</noscript>
    <footer>Screenshots stay in this tab until you save or discard them.</footer>
  </main>
</body>
</html>
