[project]
name = "video-downloader-helper"
version = "0.5.1"
description = "Local Video Downloader helper · Built by abomination81"
authors = [{ name = "Abomination81" }]
requires-python = ">=3.11"
dependencies = [
    "yt-dlp[default,curl-cffi]>=2026.8.19",
    "pydantic>=2.11,<3",
    "av>=16,<19",
    "pillow>=12,<14",
    "lxml>=6,<7",
    "cryptography>=46,<48",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10"]

[project.scripts]
video-downloader-helper = "video_downloader.native:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video_downloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
