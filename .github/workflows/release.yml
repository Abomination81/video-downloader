name: Signed release
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: signed-release
  cancel-in-progress: false
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.28'
          python-version: '3.13'
      - run: npm ci
      - run: npm run build
      - run: uv run --python 3.13 scripts/package.py
      - run: uv sync --project helper --locked --python 3.13
      - name: Sign exact update bytes
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: helper/.venv/bin/python scripts/sign-release.py
      - name: Publish complete signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py
